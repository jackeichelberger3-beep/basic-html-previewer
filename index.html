<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Viewer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="tabbar" id="tabs"></div>
  <button id="newBtn" class="tab-new" title="New tab (Ctrl+T)">+</button>

  <header class="topbar">
    <div class="brand">
      <div class="logo">&lt;/&gt;</div>
      <div class="brand-text">
        <h1>HTML Viewer</h1>
      </div>
    </div>

    <div class="actions">
      <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden />
      <button id="openBtn" class="btn">Open</button>
      <button id="formatBtn" class="btn btn-accent">Format</button>
      <button id="copyBtn" class="btn">Copy</button>
      <button id="saveBtn" class="btn">Save</button>
      <button id="wrapBtn" class="btn">Wrap: Off</button>
      <button id="clearBtn" class="btn">Clear</button>
      <button id="refreshBtn" class="btn">Refresh</button>
      <button id="newTabBtn" class="btn btn-primary">New Tab</button>
      <div class="theme-select">
        <select id="themeSelect" title="Theme">
          <option value="black">Black</option>
          <option value="grey">Grey</option>
          <option value="white">White</option>
          <option value="retro">Retro</option>
        </select>
      </div>
      <div class="theme-select">
        <select id="templateSelect" title="Insert a template">
          <option value="">Templates…</option>
        </select>
      </div>
    </div>

    <div class="view-switch">
      <button class="view-btn active" data-view="split">Split</button>
      <button class="view-btn" data-view="code">Code</button>
      <button class="view-btn" data-view="preview">Preview</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane editor-pane" id="editorPane">
      <div class="pane-header">
        <div class="lang-switch" id="langSwitch"></div>
        <span id="charCount" class="muted">0 chars</span>
      </div>
      <div class="editor-wrap">
        <pre id="lineNumbers" class="line-numbers"></pre>
        <textarea id="editor" spellcheck="false" placeholder="Write code here..."></textarea>
      </div>
      <div class="console" id="console">
        <div class="console-header">
          <button id="consoleToggle" class="console-toggle">
            <span class="chevron" id="consoleChevron">▾</span>
            <span class="console-title">Console</span>
          </button>
          <div class="console-badges" id="consoleBadges"></div>
          <div class="console-actions">
            <span id="consoleCount" class="console-count">0 messages</span>
            <button id="consoleClear" class="btn btn-ghost btn-sm" title="Clear console">Clear</button>
          </div>
        </div>
        <div class="console-body" id="consoleBody"></div>
      </div>
    </section>

    <section class="pane preview-pane" id="previewPane">
      <div class="pane-header">
        <span>PREVIEW</span>
        <button id="openTabSmall" class="btn btn-ghost btn-sm">Open ↗</button>
      </div>
      <iframe id="preview" title="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
    </section>
  </main>

  <div id="ctxMenu" class="ctx-menu" hidden></div>
  <div id="toast" class="toast"></div>

  <script src="templates.js"></script>
  <script src="script.js"></script>
</body>
</html>
